name: Demo review gate

# Mechanical enforcement of the demo-adversarial-review policy: any PR that
# touches a runnable demo (demos/**) must carry at least one Demo-Green-Review
# attestation (an adversarial reviewer verified the demo runs GREEN) in one of its
# commit messages. Independent of post-facto-human-review. See
# demos/ADVERSARIAL-REVIEW-POLICY.md and scripts/check-demo-review.sh.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Event-aware cancellation (mirrors hermit #1575 / dev-hermit-ci.yml).
  # QUEUE-DEPTH-1 on main: all main pushes share one group (github.ref) and
  # cancel-in-progress:false lets the RUNNING job finish while a newer main push
  # supersedes only the older PENDING run. Committing faster only makes the
  # green/red marks SPARSER; it does NOT reduce how many runs COMPLETE (the
  # owner's invariant: completion count is independent of commit rate). On a
  # pull_request a new push supersedes the older head (it re-runs when it lands).
  # Added because this hosted (ubuntu-latest) policy check previously had NO
  # concurrency block and fired on EVERY main push AND every PR (~252 runs/day
  # measured 2026-08-04), so each trivial job still consumed a slot in the
  # throttled shared hosted-runner admission pool.
  group: demo-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  demo-review:
    name: Demo-touching commits require a green-demo attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # need the full range base..head
      - name: Require a Demo-Green-Review attestation for demos/** changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # First push of a branch reports an all-zero base; fall back to the
          # previous commit so we still scan the new commit.
          if ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$head^"
          fi
          echo "scanning range ${base}..${head}"
          scripts/check-demo-review.sh --range "${base}..${head}"
