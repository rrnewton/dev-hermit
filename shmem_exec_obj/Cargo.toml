[workspace]
resolver = "2"
members = [
    "pod-api",
    "pod-code",
    "pod-compiler",
    "pod-loader",
    "pod-preload",
    "pod-guest",
    "pod-host",
    "pod-v2-api",
    "pod-v2-code",
    "pod-v2-compiler",
    "pod-v2-runtime",
    "pod-v2-host",
    "pod-v2-types",
    "pod-v2-derive",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
allocator-api2 = { version = "=0.4.0", default-features = false, features = ["alloc"] }
libc = "0.2.174"
lock_api = { version = "=0.4.14", default-features = false }
pod-api = { path = "pod-api" }
pod-loader = { path = "pod-loader" }
pod-v2-api = { path = "pod-v2-api" }
pod-v2-runtime = { path = "pod-v2-runtime" }
shmem-pod = { path = "pod-v2-types", version = "0.1.0", default-features = false }
sha2 = "0.10.9"
talc = { version = "=5.0.4", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
