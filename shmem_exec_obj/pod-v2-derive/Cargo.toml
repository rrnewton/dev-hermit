[package]
name = "pod-v2-derive"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[lib]
proc-macro = true
path = "src/lib.rs"

[dependencies]
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
pod-v2-types = { path = "../pod-v2-types" }
trybuild = "1.0"
