# PROPOSED workflow — destination: hermit/.github/workflows/nightly-stress.yml
#
# Held here (next to the harness it drives) until it can land: it touches the
# hermit repo, which needs a slot and a PR, and egress is 403.
#
# WHY THIS FILE EXISTS AT ALL. The nightly stress lane's only live schedule was a
# USER CRONTAB. On 2026-08-06 `crontab -l` reports no crontab for the coordinator user — it
# is gone. A schedule kept in unversioned machine-local state can vanish with no
# commit, no review, and no alarm, and this one did; nothing noticed for two
# nights. Putting the schedule in a tracked workflow is the actual fix for "it
# isn't running": the schedule becomes a reviewable artifact that cannot
# disappear without a diff.
#
# THE SHAPE THAT MATTERS: two jobs, deliberately split.
#
#   produce   the heavy burst. It CAN be cancelled at the wall (the `super` lane
#             was, twice, at exactly timeout-minutes: 360, producing zero
#             verdicts and zero alarms).
#   watchdog  cheap, minutes, runs regardless of `produce`'s outcome, and FAILS
#             when the durable store holds no fresh MEASUREMENT.
#
# The split is the point. An alarm that lives inside the heavy job dies with the
# heavy job — that is exactly how two cancelled `super` runs went unnoticed. A
# watchdog that only reads the store cannot be cancelled by the workload it
# watches, so a cancelled, hung, or never-scheduled producer surfaces the next
# morning as a red watchdog.

name: Nightly stress

on:
  schedule:
    # 04:30 UTC daily — the cadence the (now-vanished) crontab used.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      width:
        description: "Concurrent instances per wave"
        default: "64"
      waves:
        description: "Calibrated waves to attempt"
        default: "10"

# Do NOT let a later scheduled run cancel an in-flight one: a cancellation here
# is indistinguishable from the silent-cancel failure this lane exists to catch.
concurrency:
  group: nightly-stress
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    name: Nightly determinism stress (calibrated burst)
    if: github.repository == 'rrnewton/hermit'
    # Self-hosted on purpose. The flake is LOAD-DEPENDENT (~28% per-instance hang
    # at 128-wide under fleet load); an idle GitHub-hosted runner measures ~0%
    # and produces a FALSE GREEN. The calibrator below is what makes that
    # explicit rather than assumed.
    runs-on: [Linux, X64, hermit, pmu]
    timeout-minutes: 180
    env:
      STRESS_WIDTH: ${{ inputs.width || '64' }}
      STRESS_WAVES: ${{ inputs.waves || '10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The harness lives in the dev-hermit parent, alongside the durable store
      # and the calibrator binary. DEV_HERMIT_PARENT must be set on the runner.
      - name: Run the calibrated nightly burst
        run: |
          set -euo pipefail
          parent="${DEV_HERMIT_PARENT:?DEV_HERMIT_PARENT must be set on this runner}"
          STRESS_BURST_CMD="$parent/ci-hub/stress/matched-burst.sh" \
          STRESS_WIDTH="$STRESS_WIDTH" \
          STRESS_WAVES="$STRESS_WAVES" \
            "$parent/ci-hub/stress/nightly.sh"

  watchdog:
    name: Nightly stress produced a result
    if: ${{ always() && github.repository == 'rrnewton/hermit' }}
    needs: produce
    runs-on: [Linux, X64, hermit, pmu]
    timeout-minutes: 10
    steps:
      # `always()` above is load-bearing: this must run when `produce` is
      # CANCELLED or times out, which is precisely the case that previously
      # produced silence.
      - name: Report the producer's conclusion
        run: |
          echo "producer conclusion: ${{ needs.produce.result }}"
          if [ "${{ needs.produce.result }}" != "success" ]; then
            echo "::warning title=Nightly stress producer did not succeed::conclusion=${{ needs.produce.result }} — the freshness check below decides whether a usable measurement exists."
          fi

      # The authority is the DURABLE STORE, not this run's exit status. A job
      # conclusion says what happened to the job; the store says whether a
      # measurement exists. Only the second one is the thing we actually need.
      - name: Fail if no fresh measurement exists
        run: |
          set -euo pipefail
          parent="${DEV_HERMIT_PARENT:?DEV_HERMIT_PARENT must be set on this runner}"
          python3 "$parent/ci-hub/stress/check_freshness.py" --cadence-hours 24
