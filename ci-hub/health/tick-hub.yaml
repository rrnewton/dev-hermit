description: |-
  Operational health polling for the dev-hermit coordinator. The outer ORC
  workflow runs one tick every five minutes; this config owns each check's
  cadence and only emits actions when a hard warning is required.

reminders:
  # merge-gate-v4 is fail-closed: on a queued leg it records NO_RESULT, RE-DISPATCHES
  # the leg and CANCELS ITSELF, leaving `refire-on-ci-completion` to restart it. That
  # refire CANNOT ARRIVE for the runs the gate itself dispatched: it re-dispatches with
  # GH_TOKEN=github.token, so the runs carry triggering_actor=github-actions[bot], and
  # GitHub suppresses workflow_run events for GITHUB_TOKEN-triggered runs. Measured on
  # hermit#1750 (both legs completed SUCCESS, no refire ever came) and again at its
  # rebased head. Census 2026-08-07: 41 of 121 open PRs sit in this state.
  # PAGES, DOES NOT AUTO-FIRE: re-running 41 gates at once is a mass dispatch that would
  # starve the very runners the legs need. `gate_refire.py --refire` performs the action
  # under a human decision; this reminder only makes the state impossible to miss.
  - name: merge_gate_refire_due
    cadence_secs: 1800
    gate:
      cmd: python3 ci-hub/health/gate_refire.py --repo rrnewton/hermit --fail-on-due
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: merge-gate-refire
      title: "merge gates parked with all legs finished; refire is due: {summary}"

  # DELTA, not standing state. 70 slots are dead-owner RIGHT NOW and none may be
  # reclaimed (they hold unprotected work), so `--fail-on-dead` would fire on every
  # tick forever and be muted within a day -- the permanently-on failure this repo
  # already hit with the fired-state staleness alarm. The alarmable event is a slot
  # that was LIVE last tick and is DEAD now: that fires at the tick that caused it.
  # Liveness is derived from /proc cwd, so it cannot go stale. DETECT ONLY -- this
  # never reclaims, resets or cleans anything.
  - name: worktree_new_dead_owner
    cadence_secs: 900
    gate:
      cmd: python3 scripts/worktree_liveness.py report --fail-on-new-dead
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: worktree-liveness
      title: "a worktree slot's owner died since the last tick: {summary}"

  # Emits ONLY a supportable verdict. Today the series cannot support one
  # (retention 3.91d < 90d; conditioning 4/26 = 15% < 90%), so this HOLDS at rc=0
  # and says so on stdout rather than claiming "no regression". Wiring
  # --fail-over-budget instead would fire every tick forever: the main median is
  # already 659s against a 600s budget -- a standing condition, not an event.
  - name: validate_wall_regression
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/main-metrics/wall_series.py --gate-regression
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: validate-wall-time
      title: "validate wall time regressed on main: {summary}"

  # The reason the gate above is holding, surfaced ONCE A DAY so the blocker stays
  # visible instead of the check being silently inert. Daily because it is a
  # backlog condition; a per-tick page would be noise.
  - name: validate_wall_series_readiness
    cadence_secs: 86400
    gate:
      cmd: python3 ci-hub/main-metrics/wall_series.py --readiness
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: validate-wall-time
      title: "validate wall series still cannot support a verdict: {summary}"

  - name: owner_tooling_directives
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/directives/check.py
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: owner-tooling-directives
      title: "owner tooling directives need action: {summary}"

  # Local-only parent commits are the state that got 45 commits orphaned on
  # 2026-08-06. They emit no error and no failing check, so this runs on a
  # timer and PUBLISHES them rather than reporting: a report needs a reader.
  # --scope all is load-bearing -- a HEAD-scoped probe read 0 while 24 commits
  # sat unpublished.
  - name: unpushed_parent_commits
    cadence_secs: 900
    gate:
      cmd: ./ci-hub/health/unpushed_parent_commits.py --scope all --rescue
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: unpushed-parent-commits
      title: "parent commits existed only locally (now published to rescue/): {summary}"

  - name: speculative_land_obligations
    cadence_secs: 300
    gate:
      cmd: ./ci-hub/ci-hub watch-obligations --once --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: speculative-land-obligation
      title: "speculative land requires immediate attention: {summary}"

  - name: primary_checkout_snapshot
    cadence_secs: 300
    gate:
      cmd: ./ci-hub/health/operational_health.py primary-snapshot
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: primary-checkout-snapshot
      title: "primary checkout snapshot needs attention: {summary}"

  - name: github_main_health
    cadence_secs: 900
    gate:
      cmd: ./ci-hub/health/operational_health.py github-main
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: github-main
      title: "GitHub main health is {state}: {summary}"

  - name: pull_request_health
    cadence_secs: 900
    gate:
      cmd: ./ci-hub/health/operational_health.py pull-requests
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: pull-requests
      title: "open PR health is {state}: {summary}"

  - name: ci_queue_health
    cadence_secs: 900
    gate:
      cmd: ./ci-hub/health/operational_health.py queue-health
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: ci-queue-health
      title: "CI queue health is {state}: {summary}"

  # Durable, recycle-surviving alarm for SUSTAINED PMU-lane saturation. Unlike
  # ci_queue_health (which pages on any instantaneous red), this records every
  # observation to an append-only store and only fires when saturation has
  # persisted across N consecutive observations. `tick` exits 1 (sustained ->
  # page) or 2 (could-not-measure -> surface, never silent); exit 0 stays quiet
  # while still recording. The throttle a load-planner reads is
  # `lane_health.py throttle-check` (read-only, no gh) -- it NEVER gates
  # landings, because landing is what drains the lane.
  - name: ci_lane_saturation
    cadence_secs: 900
    gate:
      cmd: ./ci-hub/runners/lane_health.py tick
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: ci-lane-saturation
      title: "CI PMU lane {state}: {summary}"

  - name: stuck_agents
    cadence_secs: 300
    gate:
      cmd: ./ci-hub/health/operational_health.py agents
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: agents
      title: "agent fleet needs attention: {summary}"

  - name: active_work_reconciliation
    cadence_secs: 300
    gate:
      cmd: ./ci-hub/ci-hub active-work --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: active-work-reconciliation
      title: "task/owner/agent reality diverged: {summary}"

  # BACKLOG is intentionally absent from the routine mission/claim views.  A
  # complete no-LIMIT census is therefore required to keep unowned P0/P1 work
  # from becoming invisible.  Counts carry the live population denominator;
  # missing durable drain classifications alert instead of being inferred.
  - name: unowned_high_priority_backlog
    cadence_secs: 300
    gate:
      cmd: ./ci-hub/taskgraph/unowned_backlog.py --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: unowned-high-priority-backlog
      title: "unowned P0/P1 BACKLOG census is {state}: {summary}"

  # Refusals and agent recycling can be locally correct while leaving work
  # ownerless.  This combines three authorities: TaskGraph owner vs live ORC
  # fleet, exact refusal-note markers, and slot owner absence AND no process cwd
  # under the slot.  It only reports/wakes; slot cleanup and task reassignment
  # remain coordinator decisions.
  - name: unowned_residue
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/residue_sweep.py --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: unowned-residue
      title: "unowned residue needs routing: {summary}"

  # Podman containers run in libpod scopes outside the launching agent's process
  # cgroup, so ordinary process teardown cannot reclaim them. This gate acts only
  # on containers created through scripts/agent-podman.rs: agent-lifetime
  # containers are gracefully removed when the exact creator invocation is gone;
  # task-retained, owner-unknown, and legacy unlabelled containers are warnings.
  - name: agent_container_lifecycle
    cadence_secs: 300
    gate:
      cmd: ./scripts/agent-podman.rs reconcile --agents-json ignored/ci-hub/agent-snapshot.json --apply
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: agent-container-lifecycle
      title: "agent-owned containers need attention: {summary}"

  # Memory <-> skill sync: the sync/lint scripts existed but nothing invoked them,
  # so being in-sync was luck. This reminder runs the authoritative structural
  # linter + the report-only contradiction scanner every hour. It PROPOSES a
  # reconciliation via the wakeup; the coordinator APPLIES it. Deletion hazard:
  # ORC sessionForget() is 1-based positional (indices shift) -> apply any memory
  # deletions in DESCENDING order. Details in the scanner's own report body.
  #
  # >>> INACTIVE / NOT YET WIRED <<<  This reminder is committed but DISABLED.
  # Uncommenting the block below is what takes the mechanical layer LIVE: the
  # existing operationalHealthHeartbeat re-reads this file every 5 min and will
  # begin firing the hourly memory<->skill hard-warn. Activation is the owner's
  # call. TO ACTIVATE: remove the leading '# ' from the block below (no ORC
  # restart needed; the next heartbeat tick picks it up).
  # - name: memory_skill_sync
  #   cadence_secs: 3600
  #   gate:
  #     cmd: ./ci-hub/health/operational_health.py memory-skill-sync
  #     when: failure
  #     capture: true
  #   emit:
  #     kind: action
  #     skill: hard-warn-coordinator
  #     fields:
  #       component: memory-skill-sync
  #     title: "memory<->skill sync is {state} (REPORT-ONLY, coordinator reconciles): {summary}"

health_checks: []
